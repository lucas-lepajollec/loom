name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true


      - name: Check compiled Windows version resources
        run: python3 tools/check-version-resources.py

      - name: Run tests
        run: go test -v -short ./...

      - name: Vet Go packages
        run: go vet ./...

      - name: Cross-compile check (Windows, macOS)
        # Platform files (splash, tray) only build on their OS: catch them here,
        # not in the release or development build.
        run: |
          GOOS=windows GOARCH=amd64 go vet ./internal/loom/platform/ ./cmd/loom
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/loom
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/loom

      - name: Check reachable Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

      - name: Check concurrent execution
        run: go test -race -short ./...

      - name: Check documentation links
        run: python3 tools/check-doc-links.py

      - name: Set up Node for the public demo
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'

      - name: Check demo
        run: npm --prefix demo run check

      - name: Build binary
        run: make build

      - name: Check isolated node installation and rollback
        run: LOOM_TEST_BINARY="$PWD/bin/loom" sh tools/tests/install-node.sh

      - name: Check UI modules and tests
        run: make check-ui

      - name: Crawl every UI route for render crashes
        run: |
          npm ci --prefix tools/tests/ui-routes --no-audit --no-fund
          npx --prefix tools/tests/ui-routes playwright install --with-deps chromium
          node tools/tests/ui-routes/crawl.mjs bin/loom
