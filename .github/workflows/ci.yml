name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Run tests
        run: go test -v -short ./...

      - name: Vet Go packages
        run: go vet ./...

      - name: Set up Node for the public demo
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check demo
        run: npm --prefix demo run check

      - name: Build binary
        run: make build
