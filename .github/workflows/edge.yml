name: Development build

# Rebuilds the "edge" pre-release from every change merged into main, for
# installations that follow the Development update channel. Stable releases are
# unaffected: GitHub never reports a pre-release as the latest release.

# Built only after CI passed on main: a red main never reaches the channel.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge
  cancel-in-progress: true

jobs:
  version:
    name: Development version
    if: github.repository == 'lucas-lepajollec/loom' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: v
        run: |
          set -eu
          base=$(sed -n 's/^var Version = "\([0-9]*\.[0-9]*\.[0-9]*\)"$/\1/p' internal/loom/run.go)
          test -n "$base"
          next=$(echo "$base" | awk -F. '{printf "%d.%d.%d", $1, $2, $3 + 1}')
          echo "version=$next-dev.$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

  build-linux:
    name: Build Linux
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            asset: loom-linux
          - runner: ubuntu-24.04-arm
            arch: arm64
            asset: loom-linux-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Build native Linux binary
        run: |
          mkdir -p dist
          CGO_ENABLED=1 GOARCH=${{ matrix.arch }} go build -trimpath -ldflags "-X github.com/lucas-lepajollec/loom/internal/loom.Version=${{ needs.version.outputs.version }}" -o dist/${{ matrix.asset }} ./cmd/loom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-${{ matrix.arch }}-binary
          path: dist/
          if-no-files-found: error

  build-windows:
    name: Build Windows
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Cross-compile Windows binaries
        run: |
          mkdir -p dist
          LDFLAGS="-X github.com/lucas-lepajollec/loom/internal/loom.Version=${{ needs.version.outputs.version }}"
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "$LDFLAGS" -o dist/loom-windows.exe ./cmd/loom
          GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags "$LDFLAGS" -o dist/loom-windows-arm.exe ./cmd/loom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-binaries
          path: dist/
          if-no-files-found: error

  build-macos:
    name: Build macOS
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            asset: loom-macos-arm
          - runner: macos-15-intel
            arch: amd64
            asset: loom-macos
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Build native macOS binary
        run: |
          mkdir -p dist
          CGO_ENABLED=1 GOARCH=${{ matrix.arch }} go build -trimpath -ldflags "-X github.com/lucas-lepajollec/loom/internal/loom.Version=${{ needs.version.outputs.version }}" -o dist/${{ matrix.asset }} ./cmd/loom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-${{ matrix.arch }}-binary
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish edge pre-release
    needs: [version, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      BUILT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets/
          merge-multiple: true
      - name: Verify assets and generate checksums
        run: |
          cd release-assets
          for asset in loom-linux loom-linux-arm loom-macos loom-macos-arm loom-windows.exe loom-windows-arm.exe; do
            test -s "$asset"
          done
          sha256sum loom-linux loom-linux-arm loom-macos loom-macos-arm loom-windows.exe loom-windows-arm.exe > SHA256SUMS.txt
      - name: Replace the edge pre-release
        run: |
          set -eu
          notes="Development build of $BUILT_SHA (not a stable release). Loom installs it only when Settings › About › Updates › Channel is set to Development."
          # The "edge" tag also exists on Forgejo: the Forgejo -> GitHub push
          # mirror deletes GitHub-only tags and resets moved ones, so it is
          # never moved here. The built commit is named in the notes.
          if gh release view edge >/dev/null 2>&1; then
            # Binaries first, checksums next, version title last: a client
            # never sees the new version before its files are complete.
            gh release upload edge release-assets/loom-* --clobber
            gh release upload edge release-assets/SHA256SUMS.txt --clobber
            gh release edit edge --draft=false --prerelease --latest=false --title "edge $VERSION" --notes "$notes"
          else
            gh release create edge --target "$BUILT_SHA" --prerelease --latest=false --title "edge $VERSION" --notes "$notes" release-assets/*
          fi
