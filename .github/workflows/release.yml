name: Prepare release draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated release tag (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify tagged source and demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Verify release identity
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          test "$(git cat-file -t "refs/tags/$TAG")" = tag
          git merge-base --is-ancestor HEAD origin/main
          VERSION="${TAG#v}"
          grep -Fq "const Version = \"$VERSION\"" internal/loom/run.go
          grep -Fq "\"ProductVersion\": \"$VERSION\"" cmd/loom/versioninfo.json
          grep -Fq "## [$VERSION]" CHANGELOG.md
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Install native tray build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: go test -short ./...
      - run: go vet ./...
      - run: npm --prefix demo run check
      - run: go run ./tools/assemble-ui
      - run: git diff --exit-code -- internal/loom/ui/index.html

  build-linux:
    name: Build Linux
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            asset: loom-linux
          - runner: ubuntu-24.04-arm
            arch: arm64
            asset: loom-linux-arm
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Install native tray build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev
      - name: Assemble UI
        run: go run ./tools/assemble-ui
      - name: Build native Linux binary
        run: |
          mkdir -p dist
          CGO_ENABLED=1 GOARCH=${{ matrix.arch }} go build -trimpath -o dist/${{ matrix.asset }} ./cmd/loom
      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-${{ matrix.arch }}-binary
          path: dist/
          if-no-files-found: error

  build-windows:
    name: Build Windows
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Assemble UI
        run: go run ./tools/assemble-ui
      - name: Cross-compile Windows binaries
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o dist/loom-windows.exe ./cmd/loom
          GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o dist/loom-windows-arm.exe ./cmd/loom
      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-binaries
          path: dist/
          if-no-files-found: error

  build-macos:
    name: Build macOS
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            asset: loom-macos-arm
          - runner: macos-15-intel
            arch: amd64
            asset: loom-macos
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Assemble UI
        run: go run ./tools/assemble-ui

      - name: Build native macOS binary
        run: |
          mkdir -p dist
          CGO_ENABLED=1 GOARCH=${{ matrix.arch }} go build -trimpath -o dist/${{ matrix.asset }} ./cmd/loom

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-${{ matrix.arch }}-binary
          path: dist/
          if-no-files-found: error

  prepare-draft:
    name: Prepare unpublished draft
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets/
          merge-multiple: true

      - name: Verify all assets and generate checksums
        run: |
          cd release-assets
          for asset in loom-linux loom-linux-arm loom-macos loom-macos-arm loom-windows.exe loom-windows-arm.exe; do
            test -s "$asset"
          done
          sha256sum loom-linux loom-linux-arm loom-macos loom-macos-arm loom-windows.exe loom-windows-arm.exe > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.tag }}
          files: release-assets/*
          draft: true
          generate_release_notes: true
