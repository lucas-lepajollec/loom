name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux-windows:
    name: Build Linux & Windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Assemble UI
        run: go run ./tools/assemble-ui

      - name: Build binaries
        run: |
          mkdir -p dist
          # Linux x86_64
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/loom-linux ./cmd/loom
          # Linux arm64
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/loom-linux-arm ./cmd/loom
          # Windows x86_64
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/loom-windows.exe ./cmd/loom
          # Windows arm64
          GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/loom-windows-arm.exe ./cmd/loom

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-windows-binaries
          path: dist/

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Assemble UI
        run: go run ./tools/assemble-ui

      - name: Build binaries (Apple Silicon & Intel)
        run: |
          mkdir -p dist
          # macOS Apple Silicon (arm64)
          CGO_ENABLED=1 GOARCH=arm64 go build -ldflags="-s -w" -o dist/loom-macos-arm ./cmd/loom
          # macOS Intel (amd64)
          CGO_ENABLED=1 GOARCH=amd64 go build -ldflags="-s -w" -o dist/loom-macos ./cmd/loom

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: dist/

  publish-release:
    name: Publish Release
    needs: [build-linux-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
